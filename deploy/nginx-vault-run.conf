# nginx site for the Vault Run multiplayer server.
# Installed to /etc/nginx/sites-available/vault-run by setup-droplet.sh;
# certbot then adds the 443/TLS block and the HTTP→HTTPS redirect.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name vault-run.onlineplaymoneybank.com;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;   # keep idle websockets open
    }
}
